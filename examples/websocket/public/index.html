<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChadScript Chat</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>ChadScript Chat</h1>
        <span class="status" id="status">connecting...</span>
      </div>
      <div class="messages" id="messages"></div>
      <form class="input-bar" id="form">
        <input
          type="text"
          id="input"
          placeholder="Type a message..."
          autocomplete="off"
          autofocus
        />
        <button type="submit">Send</button>
      </form>
    </div>
    <script>
      var messages = document.getElementById("messages");
      var form = document.getElementById("form");
      var input = document.getElementById("input");
      var status = document.getElementById("status");
      var ws;

      function addMessage(text, type) {
        var div = document.createElement("div");
        div.className = "message " + type;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }

      function connect() {
        status.textContent = "connecting...";
        status.className = "status";
        ws = new WebSocket("ws://" + location.host + "/ws");

        ws.onopen = function () {
          status.textContent = "connected";
          status.className = "status connected";
          addMessage("Connected to chat server", "system");
        };

        ws.onmessage = function (e) {
          addMessage(e.data, "received");
        };

        ws.onerror = function () {
          addMessage("Connection error", "system");
        };

        ws.onclose = function () {
          status.textContent = "disconnected";
          status.className = "status disconnected";
          addMessage("Disconnected — reconnecting...", "system");
          setTimeout(connect, 2000);
        };
      }

      form.onsubmit = function (e) {
        e.preventDefault();
        var msg = input.value.trim();
        if (msg.length > 0 && ws && ws.readyState === 1) {
          ws.send(msg);
          addMessage(msg, "sent");
          input.value = "";
        }
      };

      connect();
    </script>
  </body>
</html>
