<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather by ChadScript</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="search-bar">
        <input type="text" id="zip" placeholder="Enter US ZIP code" maxlength="10" />
        <button id="search">Search</button>
      </div>
      <div id="error"></div>
      <div id="hero"></div>
      <div id="hourly"></div>
      <div id="daily"></div>
      <div class="dashboard" id="dashboard"></div>
      <div class="powered-by">
        Built with
        <a href="https://github.com/cs01/ChadScript" target="_blank">ChadScript</a> &mdash; data
        from <a href="https://www.weather.gov" target="_blank">weather.gov</a>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
