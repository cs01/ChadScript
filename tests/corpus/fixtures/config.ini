; application configuration
name = corpus-demo
version = 1.4.2

[server]
host = 127.0.0.1
port = 8080
# comments with hash too
timeout_ms = 2500
tls = false

[database]
url = postgres://localhost:5432/app
pool_size = 10
replicas = db1, db2, db3

[features]
dark_mode = true
beta = off
max_upload_mb = 12.5
