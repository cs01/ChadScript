name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: chadscript-linux-x64
          - os: macos-latest
            artifact: chadscript-macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libcurl4-openssl-dev cmake autoconf automake libtool

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm cmake autoconf automake libtool
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/usr/local/opt/llvm/bin" >> $GITHUB_PATH

      - name: Install npm dependencies
        run: npm install

      - name: Build vendor libraries
        run: bash scripts/build-vendor.sh

      - name: Build compiler
        run: npm run build

      - name: Verify vendor libraries
        run: |
          fail=0
          for lib in vendor/bdwgc/libgc.a vendor/cJSON/build/libcjson.a vendor/libuv/build/libuv.a vendor/mongoose/mongoose.o; do
            if [ ! -f "$lib" ]; then
              echo "MISSING: $lib"
              fail=1
            else
              echo "OK: $lib"
            fi
          done
          if [ "$fail" -eq 1 ]; then
            echo "Vendor library build incomplete - aborting before tests"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Build tree-sitter TypeScript objects
        run: |
          mkdir -p build
          TS_SRC=node_modules/tree-sitter-typescript/typescript/src
          TS_INCLUDE=node_modules/tree-sitter-typescript
          clang -c -O2 -fPIC -I $TS_SRC -I $TS_INCLUDE $TS_SRC/parser.c -o build/tree-sitter-typescript-parser.o
          clang -c -O2 -fPIC -I $TS_SRC -I $TS_INCLUDE $TS_SRC/scanner.c -o build/tree-sitter-typescript-scanner.o

      - name: Build native chadc
        run: node dist/index.js --link-tree-sitter --skip-semantic-analysis src/native-compiler.ts -o .build/chadc

      - name: Build native chad
        run: node dist/index.js --link-tree-sitter --skip-semantic-analysis src/chad-native.ts -o .build/chad

      - name: Smoke test native chadc
        run: |
          .build/chadc examples/hello.ts -o /tmp/hello
          /tmp/hello

      - name: Smoke test native chad
        run: |
          .build/chad build examples/hello.ts -o /tmp/hello2
          /tmp/hello2

      - name: Run stage0 tests
        run: |
          mkdir -p .build/src
          ln -sf $(pwd)/.build/chadc .build/src/native-compiler
          node --import tsx --test tests/stage0-examples.test.ts

      - name: Package release artifact
        run: |
          mkdir -p release
          cp .build/chad release/
          cp .build/chadc release/
          tar -czf ${{ matrix.artifact }}.tar.gz -C release chad chadc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  pre-release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete old latest release
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create latest pre-release
        run: |
          gh release create latest \
            --prerelease \
            --title "Latest Build" \
            --notes "Automated pre-release from main branch. Download native binaries below." \
            artifacts/**/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
