name: CI

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: chadscript-linux-x64
          - os: macos-latest
            artifact: chadscript-macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm clang libcurl4-openssl-dev cmake autoconf automake libtool

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm cmake autoconf automake libtool
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/usr/local/opt/llvm/bin" >> $GITHUB_PATH

      - name: Install npm dependencies
        run: npm install

      - name: Build vendor libraries
        run: bash scripts/build-vendor.sh

      - name: Build compiler
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Package release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release/${{ matrix.artifact }}
          cp -r dist release/${{ matrix.artifact }}/
          cp -r vendor release/${{ matrix.artifact }}/
          cp package.json release/${{ matrix.artifact }}/
          cp README.md BUILDING.md LICENSE release/${{ matrix.artifact }}/ 2>/dev/null || true
          cp -r node_modules/tree-sitter release/${{ matrix.artifact }}/node_modules/ 2>/dev/null || true
          cp -r node_modules/tree-sitter-typescript release/${{ matrix.artifact }}/node_modules/ 2>/dev/null || true
          tar -czf ${{ matrix.artifact }}.tar.gz -C release ${{ matrix.artifact }}

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
