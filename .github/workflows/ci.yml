name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx prettier --check .

  build-linux-musl:
    runs-on: ubuntu-latest
    container: node:22-alpine

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apk add --no-cache \
            llvm18 llvm18-dev clang18 lld \
            cmake make gcc g++ musl-dev \
            autoconf automake libtool \
            linux-headers git bash zstd-dev zlib-dev sqlite-dev file
          ln -sf /usr/lib/llvm18/bin/llc /usr/bin/llc
          ln -sf /usr/lib/llvm18/bin/opt /usr/bin/opt
          ln -sf /usr/bin/clang-18 /usr/bin/clang
          clang --version 2>&1 | head -2
          llc --version 2>&1 | head -4

      - name: Install npm dependencies
        run: npm install

      - name: Build vendor libraries
        run: bash scripts/build-vendor.sh

      - name: Build compiler
        run: npm run build

      - name: Verify vendor libraries
        run: |
          fail=0
          for lib in vendor/bdwgc/libgc.a vendor/yyjson/libyyjson.a vendor/libuv/build/libuv.a vendor/libwebsockets/build/lib/libwebsockets.a c_bridges/lws-bridge.o c_bridges/regex-bridge.o; do
            if [ ! -f "$lib" ]; then
              echo "MISSING: $lib"
              fail=1
            else
              echo "OK: $lib ($(wc -c < "$lib") bytes)"
            fi
          done
          if [ "$fail" -eq 1 ]; then
            echo "Vendor library build incomplete - aborting before tests"
            exit 1
          fi

      - name: Build tree-sitter TypeScript objects
        run: |
          mkdir -p build
          TS_SRC=node_modules/tree-sitter-typescript/typescript/src
          TS_INCLUDE=node_modules/tree-sitter-typescript
          clang -c -O2 -fPIC -I $TS_SRC -I $TS_INCLUDE $TS_SRC/parser.c -o build/tree-sitter-typescript-parser.o
          clang -c -O2 -fPIC -I $TS_SRC -I $TS_INCLUDE $TS_SRC/scanner.c -o build/tree-sitter-typescript-scanner.o
          clang -c -O2 -fPIC -I vendor/tree-sitter/lib/include c_bridges/treesitter-bridge.c -o build/treesitter-bridge.o

      - name: Build native chad (static)
        run: node dist/chad-node.js build src/chad-native.ts -o .build/chad --static --target-cpu=x86-64

      - name: Verify static binary
        run: |
          file .build/chad
          ldd .build/chad 2>&1 && echo "WARNING: not fully static" || echo "OK: static binary"

      - name: Smoke test native chad
        run: |
          .build/chad build examples/hello.ts -o /tmp/hello
          /tmp/hello

      - name: Run self-hosting tests
        run: node --import tsx --test tests/self-hosting.test.ts
        timeout-minutes: 15

      - name: Package release artifact
        run: |
          mkdir -p release/lib
          cp .build/chad release/
          cp build/tree-sitter-typescript-parser.o release/lib/
          cp build/tree-sitter-typescript-scanner.o release/lib/
          cp build/treesitter-bridge.o release/lib/
          cp vendor/tree-sitter/libtree-sitter.a release/lib/
          cp vendor/bdwgc/libgc.a release/lib/
          cp vendor/yyjson/libyyjson.a release/lib/
          cp vendor/libuv/build/libuv.a release/lib/
          cp vendor/libwebsockets/build/lib/libwebsockets.a release/lib/
          cp c_bridges/lws-bridge.o release/lib/
          cp c_bridges/regex-bridge.o release/lib/
          tar -czf chadscript-linux-musl-x64.tar.gz -C release chad lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chadscript-linux-musl-x64
          path: chadscript-linux-musl-x64.tar.gz

  build-linux-glibc:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm-18.list
          sudo apt-get update
          sudo apt-get install -y llvm-18 llvm-18-dev clang-18 lld-18 \
            cmake make gcc g++ \
            autoconf automake libtool \
            libzstd-dev zlib1g-dev libsqlite3-dev libcurl4-openssl-dev
          sudo ln -sf /usr/bin/llc-18 /usr/bin/llc
          sudo ln -sf /usr/bin/opt-18 /usr/bin/opt
          sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
          clang --version 2>&1 | head -2
          llc --version 2>&1 | head -4

      - name: Install npm dependencies
        run: npm install

      - name: Build vendor libraries
        run: bash scripts/build-vendor.sh

      - name: Build compiler
        run: npm run build

      - name: Verify vendor libraries
        run: |
          fail=0
          for lib in vendor/bdwgc/libgc.a vendor/yyjson/libyyjson.a vendor/libuv/build/libuv.a vendor/libwebsockets/build/lib/libwebsockets.a c_bridges/lws-bridge.o c_bridges/regex-bridge.o; do
            if [ ! -f "$lib" ]; then
              echo "MISSING: $lib"
              fail=1
            else
              echo "OK: $lib ($(wc -c < "$lib") bytes)"
            fi
          done
          if [ "$fail" -eq 1 ]; then
            echo "Vendor library build incomplete - aborting before tests"
            exit 1
          fi

      - name: Build tree-sitter TypeScript objects
        run: |
          mkdir -p build
          TS_SRC=node_modules/tree-sitter-typescript/typescript/src
          TS_INCLUDE=node_modules/tree-sitter-typescript
          clang -c -O2 -fPIC -I $TS_SRC -I $TS_INCLUDE $TS_SRC/parser.c -o build/tree-sitter-typescript-parser.o
          clang -c -O2 -fPIC -I $TS_SRC -I $TS_INCLUDE $TS_SRC/scanner.c -o build/tree-sitter-typescript-scanner.o
          clang -c -O2 -fPIC -I vendor/tree-sitter/lib/include c_bridges/treesitter-bridge.c -o build/treesitter-bridge.o

      - name: Build native chad
        run: node dist/chad-node.js build src/chad-native.ts -o .build/chad --target-cpu=x86-64

      - name: Smoke test native chad
        run: |
          .build/chad build examples/hello.ts -o /tmp/hello
          /tmp/hello

      - name: Run self-hosting tests
        run: node --import tsx --test tests/self-hosting.test.ts
        timeout-minutes: 15

      - name: Run self-hosting tests
        run: node --import tsx --test tests/self-hosting.test.ts
        timeout-minutes: 15

      - name: Package release artifact
        run: |
          mkdir -p release/lib
          cp .build/chad release/
          cp build/tree-sitter-typescript-parser.o release/lib/
          cp build/tree-sitter-typescript-scanner.o release/lib/
          cp build/treesitter-bridge.o release/lib/
          cp vendor/tree-sitter/libtree-sitter.a release/lib/
          cp vendor/bdwgc/libgc.a release/lib/
          cp vendor/yyjson/libyyjson.a release/lib/
          cp vendor/libuv/build/libuv.a release/lib/
          cp vendor/libwebsockets/build/lib/libwebsockets.a release/lib/
          cp c_bridges/lws-bridge.o release/lib/
          cp c_bridges/regex-bridge.o release/lib/
          tar -czf chadscript-linux-x64.tar.gz -C release chad lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chadscript-linux-x64
          path: chadscript-linux-x64.tar.gz

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system dependencies
        run: |
          brew install llvm cmake autoconf automake libtool zstd
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/usr/local/opt/llvm/bin" >> $GITHUB_PATH

      - name: Install npm dependencies
        run: npm install

      - name: Build vendor libraries
        run: bash scripts/build-vendor.sh

      - name: Build compiler
        run: npm run build

      - name: Verify vendor libraries
        run: |
          fail=0
          for lib in vendor/bdwgc/libgc.a vendor/yyjson/libyyjson.a vendor/libuv/build/libuv.a vendor/libwebsockets/build/lib/libwebsockets.a c_bridges/lws-bridge.o c_bridges/regex-bridge.o; do
            if [ ! -f "$lib" ]; then
              echo "MISSING: $lib"
              fail=1
            else
              echo "OK: $lib"
            fi
          done
          if [ "$fail" -eq 1 ]; then
            echo "Vendor library build incomplete - aborting before tests"
            exit 1
          fi

      - name: Build tree-sitter TypeScript objects
        run: |
          mkdir -p build
          TS_SRC=node_modules/tree-sitter-typescript/typescript/src
          TS_INCLUDE=node_modules/tree-sitter-typescript
          clang -c -O2 -fPIC -I $TS_SRC -I $TS_INCLUDE $TS_SRC/parser.c -o build/tree-sitter-typescript-parser.o
          clang -c -O2 -fPIC -I $TS_SRC -I $TS_INCLUDE $TS_SRC/scanner.c -o build/tree-sitter-typescript-scanner.o
          clang -c -O2 -fPIC -I vendor/tree-sitter/lib/include c_bridges/treesitter-bridge.c -o build/treesitter-bridge.o

      - name: Build native chad
        run: node dist/chad-node.js build src/chad-native.ts -o .build/chad

      - name: Sign macOS binaries
        run: |
          codesign --sign - --force .build/chad

      - name: Smoke test native chad
        run: |
          .build/chad build examples/hello.ts -o /tmp/hello
          /tmp/hello

      - name: Run self-hosting tests
        run: node --import tsx --test tests/self-hosting.test.ts
        timeout-minutes: 15

      - name: Package release artifact
        run: |
          mkdir -p release/lib
          cp .build/chad release/
          cp build/tree-sitter-typescript-parser.o release/lib/
          cp build/tree-sitter-typescript-scanner.o release/lib/
          cp build/treesitter-bridge.o release/lib/
          cp vendor/tree-sitter/libtree-sitter.a release/lib/
          cp vendor/bdwgc/libgc.a release/lib/
          cp vendor/yyjson/libyyjson.a release/lib/
          cp vendor/libuv/build/libuv.a release/lib/
          cp vendor/libwebsockets/build/lib/libwebsockets.a release/lib/
          cp c_bridges/lws-bridge.o release/lib/
          cp c_bridges/regex-bridge.o release/lib/
          tar -czf chadscript-macos-arm64.tar.gz -C release chad lib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chadscript-macos-arm64
          path: chadscript-macos-arm64.tar.gz

  test-artifact:
    needs: [build-linux-musl, build-linux-glibc, build-macos]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: chadscript-linux-x64
          - os: macos-latest
            artifact: chadscript-macos-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y llvm clang

      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}

      - name: Install via install.sh
        run: |
          CHADSCRIPT_URL="file://$(pwd)/${{ matrix.artifact }}.tar.gz" bash install.sh
          echo "$HOME/.chadscript" >> $GITHUB_PATH

      - name: Verify binary
        run: |
          file ~/.chadscript/chad.bin
          ls -la ~/.chadscript/lib/

      - name: Smoke test - hello world
        run: |
          echo 'console.log("Hello from release artifact!");' > /tmp/hello.ts
          chad run /tmp/hello.ts

      - name: Smoke test - compile to binary
        run: |
          echo 'process.exit(42);' > /tmp/exit42.ts
          chad build /tmp/exit42.ts -o /tmp/exit42
          /tmp/exit42 || [ $? -eq 42 ]

  release:
    needs: [build-linux-musl, build-linux-glibc, build-macos, test-artifact]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete old latest release
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Create latest release
        run: |
          gh release create latest \
            --title "Latest Build" \
            --notes "Automated release from ${GITHUB_REF_NAME} branch. Download native binaries below." \
            --latest \
            artifacts/**/*.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  tagged-release:
    needs: [build-linux-musl, build-linux-glibc, build-macos, test-artifact]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          generate_release_notes: true
