name: ci

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned: bun "latest" regressed on async node:test callbacks ("test() inside another
          # test()"). This matches the local dev version.
          bun-version: "1.3.10"

      # LLVM (clang + opt). Installed as versioned binaries on Linux; point the compiler at
      # them via CHAD_CLANG / CHAD_OPT (see src/driver/toolchain.ts).
      - name: Install LLVM + Boehm GC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 llvm-18 libgc-dev
          echo "CHAD_CLANG=clang-18" >> "$GITHUB_ENV"
          echo "CHAD_OPT=opt-18" >> "$GITHUB_ENV"
          # libgc-dev installs into system paths; no CHAD_GC_PREFIX needed.

      - name: Install LLVM + Boehm GC (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm bdw-gc
          PREFIX="$(brew --prefix llvm)"
          echo "CHAD_CLANG=$PREFIX/bin/clang" >> "$GITHUB_ENV"
          echo "CHAD_OPT=$PREFIX/bin/opt" >> "$GITHUB_ENV"
          echo "CHAD_GC_PREFIX=$(brew --prefix bdw-gc)" >> "$GITHUB_ENV"

      - run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      # Generous per-test timeout: differential tests each run two clang compiles (O0+O2);
      # bun's 5s default is too tight for a cold Homebrew clang on the macOS runner.
      - name: Test (rejection + differential + unit)
        run: bun test --timeout 60000 tests/

      # Second lane over the SAME suite, with the runtime and every compiled fixture built under
      # AddressSanitizer + UndefinedBehaviorSanitizer. -fno-sanitize-recover makes any report
      # abort the binary, which the differential harness already sees as a crash divergence — so
      # this needs no separate assertions. See src/driver/toolchain.ts for what it does and does
      # not cover (notably: not the Boehm heap).
      - name: Test (sanitized lane)
        run: bun run test:san
