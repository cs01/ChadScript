[package]
name = "swc-bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]

[dependencies]
swc_ecma_parser = "39"
swc_ecma_ast = { version = "23", features = ["serde-impl"] }
swc_common = "21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
